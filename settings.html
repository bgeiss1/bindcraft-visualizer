<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The settings file · BindCraft2 Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <section class="intro">
    <h1 data-t="settings.title"></h1>
    <p data-t="settings.intro"></p>
  </section>
  <section class="card">
    <p data-t="settings.layers"></p>
    <p class="muted small" data-t="settings.layerHint"></p>
  </section>
  <div class="work wide">
    <div class="panel" id="form"></div>
    <div class="panel" id="json"></div>
  </div>
  <section class="card">
    <h2>Two things to leave alone</h2>
    <p class="note warn" data-t="settings.weights"></p>
    <p class="note warn" data-t="settings.stacking"></p>
  </section>
</main>
<script type="module" src="js/pages/settings.js"></script>
</body>
</html>
