<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pick the target and the epitope · BindCraft2 Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bitter:wght@700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <section class="intro">
    <h1 data-t="target.title"></h1>
    <p data-t="target.intro"></p>
  </section>
  <section class="card">
    <label class="field">Target
      <select id="target"></select>
    </label>
    <p id="target-note" class="muted"></p>
  </section>
  <div class="work">
    <div class="viewer-wrap">
      <div class="view-tools" id="view-tools"></div>
      <div class="viewer" id="viewer"></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
  <section class="card">
    <h2>Hotspots</h2>
    <p data-t="target.unguided"></p>
    <p class="note" data-t="target.hotspotRule"></p>
    <p data-t="target.coldspots"></p>
    <p class="note warn" data-t="target.prepare"></p>
    <div id="hotspot-build"></div>
  </section>
  <section class="card">
    <h2 data-t="target.faces.title"></h2>
    <p data-t="target.faces.intro"></p>
    <p data-t="target.faces.unguided"></p>
    <p data-t="target.faces.short"></p>

    <h3 data-t="target.faces.greaseTitle"></h3>
    <p data-t="target.faces.grease"></p>
    <p data-t="target.faces.ring"></p>
    <p class="note warn" data-t="target.faces.greaseWarn"></p>

    <h3 data-t="target.faces.shapeTitle"></h3>
    <p data-t="target.faces.shape"></p>
    <p data-t="target.faces.shapeWhy"></p>
    <p data-t="target.faces.shapeStructure"></p>

    <h3 data-t="target.faces.wrongTitle"></h3>
    <p data-t="target.faces.wrongScatter"></p>
    <p data-t="target.faces.wrongCharge"></p>
    <p class="note" data-t="target.faces.chargePattern"></p>
    <p data-t="target.faces.wrongFloppy"></p>

    <h3 data-t="target.faces.funnelTitle"></h3>
    <p data-t="target.faces.funnel"></p>
    <p data-t="target.faces.funnelStage"></p>
    <p data-t="target.faces.funnelNumbers"></p>
    <p class="note" data-t="target.faces.funnelLesson"></p>
    <p data-t="target.faces.hotspotCost"></p>

    <h3 data-t="target.faces.checklistTitle"></h3>
    <ol class="faces-checklist">
      <li data-t="target.faces.checklist1"></li>
      <li data-t="target.faces.checklist2"></li>
      <li data-t="target.faces.checklist3"></li>
      <li data-t="target.faces.checklist4"></li>
      <li data-t="target.faces.checklist5"></li>
    </ol>
    <p data-t="target.faces.closing"></p>
  </section>
</main>
<script type="module" src="js/pages/target.js"></script>
</body>
</html>
